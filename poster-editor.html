<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>单图故事卡编辑 · 上个钩</title>
  <link rel="stylesheet" href="./poster-editor.css?v=3" />
  <link rel="icon" href="./assets/design-preview/kanshan/app-icon-blue-v7.png">
  <link rel="stylesheet" href="./studio-theme.css?v=1">
</head>
<body class="poster-editor-page">
  <header class="topbar">
    <div class="brand"><img class="brand-icon" src="./assets/design-preview/kanshan/app-icon-blue-v7.png" width="40" height="40" alt=""><div><b>单图故事卡编辑</b><small>把传播文案排成适合阅读的画面</small></div></div>
    <span class="save-state" id="saveState">尚未保存</span>
    <button class="save-button" id="saveBtn" type="button">保存</button>
    <button class="return-button" id="backBtn" type="button" disabled>返回</button>
  </header>

  <main class="editor-shell">
    <aside class="controls">
      <section>
        <div class="section-head"><div><b>1. 选择表现形式</b><small>选择适合故事节奏的排版</small></div></div>
        <div class="style-grid" id="styleList"></div>
      </section>

      <section>
        <div class="section-head"><div><b>2. 调整文案分句</b><small>每行是一块独立画面文字，建议 4–6 行</small></div></div>
        <textarea id="linesInput" rows="7" maxlength="320"></textarea>
        <button class="apply-copy" id="applyCopyBtn" type="button">应用分句</button>
      </section>

      <section>
        <div class="section-head"><div><b>3. 调整画面气质</b><small>先保证文字清楚，再追求氛围</small></div></div>
        <label class="tone-field">画面滤镜<select id="toneSelect"><option value="cinema">电影暗调</option><option value="cool">冷蓝夜色</option><option value="warm">暖色回忆</option><option value="mono">黑白纪实</option><option value="clear">通透明亮</option></select></label>
      </section>

      <section>
        <div class="section-head"><div><b>4. 换一张底图</b><small>题材与时空相关项排在前面</small></div></div>
        <div class="background-list" id="backgroundList"></div>
      </section>
    </aside>

    <section class="preview-area">
      <div class="preview-head"><div><b id="posterName">单图故事卡预览</b><small id="styleDescription">适合短视频首屏与图文首图</small></div><span>1080 × 1440</span></div>
      <div class="stage">
        <div class="canvas-shell" id="canvasShell"><canvas id="posterCanvas" width="540" height="720"></canvas></div>
      </div>
      <div class="stage-foot"><span>可直接拖动文字块微调位置</span><button id="resetLayoutBtn" type="button">恢复推荐排版</button></div>
    </section>
  </main>

  <div class="toast" id="editorToast" role="status" aria-live="polite"></div>
  <script src="./third_party/fabric/fabric.min.js"></script>
  <script src="./poster-editor.js?v=6"></script>
</body>
</html>
